<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweeper — Operator Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root { color-scheme: dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 24px;
            font-size: 14px;
        }
        h2 { margin: 0 0 12px 0; font-size: 18px; }
        .hint { color: #8b949e; font-size: 13px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
		.forward-form .field { margin-bottom: 10px; }
		.forward-form .field label { display: block; margin-bottom: 4px; font-size: 12px; color: #8b949e; }
		.forward-form .field input {
			width: 100%;
			padding: 8px 12px;
			background: #0d1117;
			border: 1px solid #30363d;
			border-radius: 6px;
			color: #c9d1d9;
			font-size: 13px;
			font-family: ui-monospace, "SF Mono", Menlo, monospace;
			box-sizing: border-box;
		}
        .login-card { max-width: 480px; margin: 80px auto 0; }
        .login-card input {
            width: 100%;
            padding: 8px 12px;
            margin: 12px 0;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            box-sizing: border-box;
        }
        .admin-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            align-items: center;
        }
        .admin-nav .spacer { flex: 1; }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: #30363d; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-primary { background: #238636; border-color: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; }
        .row { margin-bottom: 8px; }
        .receipt-row { margin-left: 16px; margin-bottom: 4px; font-size: 13px; color: #8b949e; }
        .receipt-row code {
            background: #0d1117;
            padding: 2px 6px;
            border-radius: 3px;
            color: #c9d1d9;
            font-size: 12px;
        }
        .actions { margin-top: 12px; }
        .done { opacity: 0.6; }
        .success { color: #3fb950; }
        .error { color: #f85149; margin: 8px 0; }
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid #30363d;
            border-top-color: #c9d1d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th, .summary-table td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #30363d;
        }
        .summary-table th { color: #8b949e; font-weight: normal; font-size: 12px; text-transform: uppercase; }
        .field { margin-bottom: 12px; }
        .field label { display: block; margin-bottom: 4px; font-size: 13px; color: #8b949e; }
        .field input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            box-sizing: border-box;
        }
        .result { margin-top: 12px; }
        code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    </style>
</head>
<body>
    <div id="admin-root"></div>
    <script src="admin.js" type="module"></script>
</body>
</html>
